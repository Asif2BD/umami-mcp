name: Publish to npm

# Two ways in:
#   - push a version tag  ->  git tag v0.1.1 && git push --tags
#   - run it by hand from the Actions tab (needed for the very first publish,
#     since the v0.1.0 tag already exists)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and for build provenance.
  # Without it npm falls back to NPM_TOKEN.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; the version bundled with
      # Node 22 is older than that.
      - name: Use an npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone -- npm forbids reusing a
      # version number. Catch it before the publish, not after.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi
          echo "version $PKG matches tag $GITHUB_REF_NAME"

      - name: Show what would be published
        run: npm pack --dry-run

      # Refuse to ship a tarball carrying secrets. `files` in package.json
      # should already restrict this to dist/, but a mistake there would
      # publish credentials to a public registry permanently.
      - name: Tarball must not contain secrets
        run: |
          npm pack --silent >/dev/null
          TARBALL=$(ls -t ./*.tgz | head -1)
          if tar -tzf "$TARBALL" | grep -Ei '(^|/)\.env($|\.)|(^|/)\.npmrc$|token|secret' ; then
            echo "::error::Refusing to publish: tarball contains a file that looks like a credential."
            exit 1
          fi
          echo "tarball is clean"
          rm -f "$TARBALL"

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        # --provenance attaches a signed, verifiable link back to this workflow
        # run, so installers can confirm the tarball was built from this repo.
        run: npm publish --access public --provenance
        env:
          # Ignored once trusted publishing is configured on npmjs.com; needed
          # for the first publish, before the package exists there.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
